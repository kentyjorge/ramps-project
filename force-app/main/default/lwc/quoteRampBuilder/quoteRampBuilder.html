<template>
    <lightning-card>
        <template lwc:if={error}>
            <div class="slds-p-around_medium slds-text-color_error">
                Could not load quote context. Check object/field access.
            </div>
        </template>

        <template lwc:if={context}>
            <div class="slds-p-around_medium">
                <template lwc:if={showProcessingView}>
                    <div class="slds-align_absolute-center slds-text-align_center slds-p-vertical_x-large">
                        <div>
                            <lightning-spinner alternative-text="Applying ramp" size="medium"></lightning-spinner>
                            <div class="slds-text-heading_small slds-m-top_medium">{progressStage}</div>
                            <p class="slds-text-body_small slds-m-top_x-small">
                                Please wait while we build your ramp schedule.
                            </p>
                        </div>
                    </div>
                </template>

                <template lwc:if={showSuccessView}>
                    <div class="slds-align_absolute-center slds-text-align_center slds-p-vertical_x-large">
                        <div>
                            <div class="slds-text-heading_small slds-text-color_success">Ramp Segments Created</div>
                            <p class="slds-text-body_regular slds-m-top_small">{successMessage}</p>
                            <p class="slds-text-body_small slds-m-top_x-small">
                                You can close this window when ready.
                            </p>
                        </div>
                    </div>
                </template>

                <template lwc:if={showBuilderView}>
                    <p class="slds-text-body_regular slds-m-bottom_xx-small">
                        Please define your segments and then select the applicable products below the segment table.
                    </p>

                    <div class="controls-row slds-grid slds-gutters_small">
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-input
                                type="number"
                                label="Number of segments"
                                min="1"
                                max="12"
                                value={segmentCount}
                                onchange={handleSegmentCountChange}
                                variant="label-stacked"
                            ></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-combobox
                                label="Type (applies to all segments)"
                                value={segmentType}
                                options={segmentTypeOptions}
                                onchange={handleGlobalSegmentTypeChange}
                                variant="label-stacked"
                            ></lightning-combobox>
                        </div>
                    </div>

                    <div class="preview-container slds-m-top_medium">
                        <div class="preview-title">Segment Definitions</div>
                        <div class="table-wrapper">
                            <table class="preview-table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Segment Name</th>
                                        <th>Start Date</th>
                                        <th>Months</th>
                                        <th>End Date</th>
                                        <th>Uplift %</th>
                                        <th>Discount %</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={segments} for:item="seg" for:index="index">
                                        <tr key={seg.key} class="segment-row">
                                            <td class="segment-number">
                                                <span class="segment-badge">{seg.segmentIndex}</span>
                                            </td>
                                            <td>
                                                <input
                                                    type="text"
                                                    class="editable-input"
                                                    value={seg.name}
                                                    data-index={index}
                                                    data-field="name"
                                                    onchange={handleSegmentField}
                                                    placeholder="e.g. Year 1"
                                                />
                                            </td>
                                            <td>
                                                <input
                                                    type="date"
                                                    class="editable-input date-input"
                                                    value={seg.startDate}
                                                    data-index={index}
                                                    data-field="startDate"
                                                    onchange={handleSegmentField}
                                                />
                                            </td>
                                            <td>
                                                <input
                                                    type="number"
                                                    class="editable-input number-input-narrow"
                                                    value={seg.months}
                                                    min="1"
                                                    data-index={index}
                                                    data-field="months"
                                                    onchange={handleSegmentField}
                                                />
                                            </td>
                                            <td>
                                                <input
                                                    type="date"
                                                    class="editable-input date-input"
                                                    value={seg.endDate}
                                                    data-index={index}
                                                    data-field="endDate"
                                                    onchange={handleSegmentField}
                                                />
                                            </td>
                                            <td>
                                                <input
                                                    type="number"
                                                    class="editable-input number-input-narrow"
                                                    value={seg.uplift}
                                                    step="0.01"
                                                    min="0"
                                                    max="100"
                                                    data-index={index}
                                                    data-field="uplift"
                                                    onchange={handleSegmentField}
                                                />
                                            </td>
                                            <td>
                                                <input
                                                    type="number"
                                                    class="editable-input number-input-narrow"
                                                    value={seg.discount}
                                                    step="0.01"
                                                    min="0"
                                                    max="100"
                                                    data-index={index}
                                                    data-field="discount"
                                                    onchange={handleSegmentField}
                                                />
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <template lwc:if={showRampProductSelection}>
                        <div class="slds-m-top_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Products Included In Ramp Schedule</h3>
                            <p class="slds-text-body_small slds-m-bottom_small">
                                All term-defined products are included in each ramp segment.
                            </p>
                            <template lwc:if={hasRampEligibleProducts}>
                                <template for:each={rampEligibleLineRows} for:item="row">
                                    <div key={row.id} class="slds-m-bottom_xx-small" style={row.indentStyle}>
                                        <span class="slds-text-body_small">{row.displayLabel}</span>
                                    </div>
                                </template>
                            </template>
                            <template lwc:else>
                                <div class="slds-text-body_small slds-text-color_weak">
                                    No quote lines are eligible for ramp inclusion (Pricing Term must be greater than 0).
                                </div>
                            </template>
                        </div>
                    </template>

                    <div class="slds-m-top_medium">
                        <lightning-button
                            variant="brand"
                            label="Apply ramp"
                            onclick={handleApply}
                            disabled={applying}
                        ></lightning-button>
                    </div>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
